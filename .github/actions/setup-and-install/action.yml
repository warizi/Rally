name: Setup Node and install deps
description: |
  Set up Node.js, restore node_modules from cache, and run npm ci only on
  cache miss. Centralizes the install boilerplate that previously appeared in
  every job of test.yml.

inputs:
  node-version:
    description: Node.js version
    required: false
    # 22 하한: better-sqlite3 13(>=22) · @electron/rebuild 4(>=22.12) · @electron/get 5(>=22.12)
    # · concurrently 10(>=22). Node 20 에서는 npm rebuild 가 실패해 테스트 워커가 전부
    # import 단계에서 죽는다 (PR #352 에서 확인).
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
