name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    # macos-latest(= macOS 26) 의 2026-08-31 이미지부터 electron-builder 26.x 의 임시 키체인 처리가 깨진다
    # (security set-key-partition-list 에 .p12 비밀번호를 넘겨 SecKeychainUnlock 실패 —
    # electron-userland/electron-builder#10066, 수정 #10101/#10172 는 2026-09-04 기준 미배포).
    # 수정이 포함된 electron-builder 로 올린 뒤 macos-latest 로 되돌릴 것.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MCP server
        run: npm run build:mcp

      # electron-builder 는 draft 가 없으면 업로드 태스크마다 경쟁적으로 draft 를 만들어 자산이 여러
      # draft 로 갈라진다 (v1.17.2 에서 두 번 재현 — build-win 직렬화만으로는 부족). 빌드 전에 draft 를
      # 하나 만들어 두면 electron-builder 는 "existingType=draft" 로 그 draft 에만 올린다.
      - name: Pre-create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — skip"
          else
            gh release create "$tag" --draft --title "${tag#v}" --notes "" --target "$GITHUB_SHA"
          fi

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build:mac

  # Windows 산출물은 반드시 Windows runner에서 npm ci 한 dependency tree로 패키징한다.
  # macOS node_modules를 재사용하면 darwin native addon(better-sqlite3 등)이 섞여
  # Windows 실행 시 DB 초기화 전에 크래시한다.
  build-win:
    runs-on: windows-latest
    # mac 과 동시에 publish 하면 electron-builder 가 각자 draft release 를 만들어 v1.17.2 처럼 draft 가
    # 둘로 갈라진다(자산 분산). mac 이 먼저 draft 를 만든 뒤 win 이 거기에 올리도록 직렬화.
    needs: build-mac
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall의 @electron/rebuild가 Electron ABI에 맞춰 native addon을 빌드하므로
      # --ignore-scripts를 쓰면 안 된다.
      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win -- --x64 --publish always

      # darwin/linux native addon 혼입 검사. release는 draft라 실패 시 publish 전에 걸러진다.
      - name: Verify Windows native modules
        run: npm run check:win-native
