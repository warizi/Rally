appId: com.jin.rally
productName: Rally
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# .claude/commands·skills 는 git 미추적(.gitignore)이라 CI fresh checkout에 존재하지 않음 —
# extraResources에서 제거 (누락 경고 원인). 런타임(claude-commands-setup.ts)은 디렉터리
# 부재 시 빈 목록으로 동작하므로 코드는 유지.
extraResources:
  - from: src/main/db/migrations
    to: migrations
  - from: dist-mcp
    to: dist-mcp
asarUnpack:
  - resources/**
  # sqlite-vec 네이티브 확장(.dylib/.so/.dll)은 asar 내부에서 로드 불가 → 언팩 필수
  - '**/node_modules/sqlite-vec/**'
  - '**/node_modules/sqlite-vec-*/**'
  # transformers.js + onnxruntime-node 네이티브 바이너리 → 언팩 필수
  - '**/node_modules/@xenova/transformers/**'
  - '**/node_modules/onnxruntime-node/**'
win:
  executableName: rally
  # Windows 코드 서명: 실기 smoke test 통과 전까지 미서명 임시 수용 (SmartScreen 경고 예상).
  # 공개 배포 전 OV 인증서(WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD) 또는 Azure Trusted Signing
  # (win.azureSignOptions) 중 결정 후 release.yml build-win job에 secret 주입.
  # 1차 Windows 배포는 x64 단일. Apple Silicon에서 bare `electron-builder --win` 실행 시
  # 기본 arm64 산출물이 생기는 혼동 방지. arm64 추가 시 artifactName에 ${arch} 필요.
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # 버전 없는 고정 파일명 — releases/latest/download/rally-setup.exe 가 항상 최신을
  # 가리키도록 (mac 은 이미 rally.dmg 로 고정). 버전은 latest.yml/릴리스 태그가 담당.
  artifactName: ${name}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${name}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: warizi
  repo: Rally
  releaseType: draft
